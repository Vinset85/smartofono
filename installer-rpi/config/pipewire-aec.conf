# ATTENZIONE: questa configurazione NON e' quella in uso e non va installata
# in ~/.config/pipewire/pipewire.conf.d/ senza prima leggere qui sotto.
#
# L'AEC attivo e' il `module-echo-cancel` di PulseAudio, caricato da
# videocitofono-mic-volume.service via pactl, con sink_master e source_master
# espliciti sui device ALSA fisici. Il modulo nativo PipeWire di questo file non
# instrada il playback al sink fisico mantenendo il riferimento AEC, ed e' il
# motivo per cui e' stato abbandonato.
#
# Il file resta come riferimento dei parametri. Se lo si attiva, i nodi si
# chiamano echo-cancel-sink / echo-cancel-source, mentre audio_backchannel.py
# cerca ec_sink: l'audio bypasserebbe la cancellazione, con Larsen garantito.
# Un parametro di qui non e' nella configurazione attiva e vale una prova:
# delay_agnostic, che rende l'AEC robusto a un ritardo non costante fra
# riferimento ed eco. Potrebbe accorciare il mezzo secondo di convergenza
# misurato all'inizio di ogni chiamata.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      node.latency = 480/48000
      monitor.mode = true

      # capture.props = nodo che PRENDE l'audio dal mic fisico
      # (input dell'AEC). Lo agganciamo esplicitamente all'ALSA
      # input fisico altrimenti PipeWire lo lega al "default
      # source" che pero' siamo NOI -> loop infinito.
      capture.props = {
        node.name      = "vc-mic-raw"
        node.passive   = true
        node.target    = "alsa_input.platform-soc_107c000000_sound.stereo-fallback"
        target.object  = "alsa_input.platform-soc_107c000000_sound.stereo-fallback"
      }

      # source.props = source virtuale che le applicazioni usano
      # per leggere il mic con eco gia' cancellato.
      source.props = {
        node.name        = "echo-cancel-source"
        node.description = "Mic AEC (videocitofono)"
        media.class      = "Audio/Source"
      }

      # sink.props = sink virtuale dove le app scrivono il
      # playback (aplay talkback). L'audio attraversa l'AEC come
      # riferimento e viene routato al device fisico via
      # playback.props.
      sink.props = {
        node.name        = "echo-cancel-sink"
        node.description = "Speaker AEC (videocitofono)"
        media.class      = "Audio/Sink"
      }

      # playback.props = nodo che SCRIVE l'audio sul device
      # fisico (output reale). Va agganciato esplicitamente
      # all'ALSA output altrimenti PipeWire lo lega al "default
      # sink" che siamo NOI -> loop infinito + nessun suono.
      playback.props = {
        node.name      = "vc-spk-raw"
        node.passive   = true
        node.target    = "alsa_output.platform-soc_107c000000_sound.stereo-fallback"
        target.object  = "alsa_output.platform-soc_107c000000_sound.stereo-fallback"
      }

      aec.args = {
        webrtc.gain_control          = true
        webrtc.extended_filter       = true
        webrtc.delay_agnostic        = true
        webrtc.high_pass_filter      = true
        webrtc.noise_suppression     = true
        webrtc.voice_detection       = true
        webrtc.experimental_agc      = true
        webrtc.experimental_ns       = true
      }
    }
  }
]
