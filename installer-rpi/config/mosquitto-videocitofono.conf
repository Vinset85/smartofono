# Videocitofono — Mosquitto (drop-in /etc/mosquitto/conf.d/)
# Eseguire scripts/setup-mqtt-auth.sh per creare passwordfile e utenti.
#
# Questo file definisce il listener 1883. Il mosquitto.conf di Debian ne
# dichiara uno identico DOPO la direttiva include_dir, quindi le sue righe
# `listener 1883` e `allow_anonymous true` vanno commentate: senza quel passo
# mosquitto rifiuta l'avvio con "Duplicate listener on port 1883".
# setup-mqtt-auth.sh se ne occupa.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/conf.d/videocitofono.passwd

# HA (LAN) + app locale
# Utenti: videocitofono (RPi app), homeassistant (broker client HA)
