name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Template MQTT, notify, smoke RPi
        run: |
          python3 -m pip install --quiet "paho-mqtt>=2.1.0,<3.0"
          python3 scripts/run-tests.py
