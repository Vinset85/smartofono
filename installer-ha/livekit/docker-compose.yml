services:
  # ---------------------------------------------------------------------------
  # Redis: unico canale fra livekit-server e livekit-egress (coda dei job di
  # registrazione). bind 127.0.0.1 -> non raggiungibile dalla LAN. Nessuna
  # persistenza: contiene solo job effimeri e stato room.
  # ATTENZIONE: livekit-server con `redis:` in config non parte se Redis e'
  # giu', da qui il depends_on con condition service_healthy.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379 --save '' --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # LiveKit Server (SFU WebRTC self-hosted).
  # Network host: serve per esporre direttamente la porta UDP single-mux 8100
  # senza passare dal NAT del bridge Docker (rompe ICE).
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: livekit
    restart: unless-stopped
    network_mode: host
    command:
      - --config
      - /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - /mnt/data/supervisor/ssl:/ssl:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # LiveKit Egress: registra in MP4 il visitatore al citofono (participant
  # egress su identity `rpi`). Vedi egress.yaml per il razionale della scelta.
  # I file finiscono in /config/www/videocitofono lato HA -> subito servibili
  # come /local/videocitofono/<file>.mp4 dal popup e dal registro chiamate.
  # ---------------------------------------------------------------------------
  egress:
    image: livekit/egress:v1.15.0
    container_name: livekit-egress
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - /mnt/data/supervisor/homeassistant/www/videocitofono:/out
    depends_on:
      - livekit

  # ---------------------------------------------------------------------------
  # Token issuer (FastAPI) - firma JWT LiveKit per browser HA e Pi.
  # ---------------------------------------------------------------------------
  token-issuer:
    build:
      context: ./token_issuer
    image: videocitofono-token-issuer:1
    container_name: livekit-token-issuer
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_API_KEY: videocitofono
      LIVEKIT_API_SECRET: SOSTITUISCI_CON_IL_TUO_LIVEKIT_API_SECRET
      # ws_url restituito al client. Stesso origin (Caddy) -> nessun
      # mixed-content quando HA e' aperto in HTTPS.
      # NB: senza `/rtc` finale. Il SDK livekit-client appende /rtc da solo;
      # Caddy strippa /livekit prefix -> upstream /rtc (signaling LK server).
      LIVEKIT_HOST: wss://casa-esempio.duckdns.org/livekit
      # Fallback per client interni (Pi RPi che parla in LAN al miniPC HA
      # senza passare da Caddy). Vedi installer-rpi/app/modules/livekit_client.py.
      LIVEKIT_HOST_LAN: ws://192.168.1.160:7880
      TOKEN_ISSUER_PORT: "8081"
      TOKEN_ISSUER_SECRET: ${TOKEN_ISSUER_SECRET:-}
      # Endpoint /egress/*: HA li chiama per avviare/fermare la registrazione.
      # Il secret e' obbligatorio (l'issuer rifiuta 401 se assente).
      EGRESS_SECRET: ${EGRESS_SECRET:-}
      # API REST del server (twirp) per Start/Stop/ListEgress.
      LIVEKIT_API_URL: http://127.0.0.1:7880
      # Prefisso dei filepath richiesti all'egress: e' il mount /out del
      # container egress, non un path dell'host.
      EGRESS_OUTPUT_DIR: /out
    depends_on:
      - livekit

  # ---------------------------------------------------------------------------
  # Caddy edge: TLS terminator unificato per HA + LiveKit + token issuer.
  # Ascolta sulla porta 443 dell'host. Single origin per tutti i client.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.11-alpine
    container_name: livekit-caddy
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cert gestiti dall'addon DuckDNS+LE di HA. Path host (HA OS standard):
      #   /mnt/data/supervisor/ssl/  -> /ssl   dentro il container.
      # Se non usi DuckDNS addon, sostituisci con il volume Caddy data
      # (~/.caddy/data) e abilita il vhost TLS-MANAGED-BY-CADDY nel Caddyfile.
      - /mnt/data/supervisor/ssl:/ssl:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - livekit
      - token-issuer
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/livekit-token/health"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
